<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form action="https://httpbin.org/get" method="get">


        <fieldset>
            <p>Datos personales</p>

            <!-- <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" minlength="3" autofocus>

            <label for="apellido">Apellido:</label>
            <input type="text" id="Edad" name="apellido">-->

            <div class="fila">

                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos">
                </div>

            </div>

            <div class="fila">

                <div class="campo">

                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

                </div>
                <div class="campo">
                    <label for="telefono">Teléfono:</label>
                    <input type="text" id="telefono" name="Teléfono">
                </div>
            </div>



            <label for="edad">Edad:</label>
            <input type="number" id="Edad" name="edad" min="18" max="100">


        </fieldset>


        <fieldset>

            <p>Datos de la reserva</p>

            <div class="fila">
                <div class="campo">
                    <label for="reserva">Reserva:</label>

                    <select id="reserva" name="reserva">
                        <option value="individual">Individual</option>
                        <option value="doble">Doble</option>
                        <option value="familiar">Familiar</option>

                    </select>
                </div>

                <div class="campo">
                    <label for="personas">Personas:</label>
                    <input type="number" id="personas" name="personas" min="1" max="6">
                </div>
            </div>

            <label for="fecha de llegada">Fecha de llegada:</label>
            <input type="date" id="fecha de llegada" name="fecha de llegada">




            <fieldset>
                <P>Alojamiento</P>
                <input type="radio" id="Solo alojamiento" name="alojamiento" value="solo alojamiento" checked>
                <label for="Solo alojamiento">Solo alojamiento</label>

                <input type="radio" id="Desayuno incluido" name="alojamiento" value="Desayuno incluido">
                <label for="Desayuno incluido">Desayuno incluido</label>

                <input type="radio" id="Media pension" name="alojamiento" value="Media pension">
                <label for="Media pension">Media pensión</label>


            </fieldset>

            <fieldset>

                <p>Servicios adicionales</p>

                <input type="checkbox" id="Aparcamiento" name="option" value="Aparcamiento">
                <label for="Aparcamiento">Aparcamiento</label>

                <input type="checkbox" id="Cuna" name="option" value="Cuna">
                <label for="Cuna">Cuna</label>

                <input type="checkbox" id="Servicio de lavandería" name="option" value="Servicio de lavanderia">
                <label for="Servicio de lavanderia">Servicio de lavandería</label>

                <input type="checkbox" id="Visita guiada" name="option" value="Visita guiada">
                <label for="Visita guiada">Visita guíada</label>


            </fieldset>


            <fieldset>
                <legend>Información adicional</legend>
                <label for="codigo">Código de reserva:</label>
                <input type="text" id="codigo" name="codigo" value="CR2026" readonly required>
            </fieldset>

            <fieldset>
                <legend>Descuento promocional</legend>
                <label for="codigo">Código de reserva:</label>
                <input type="text" id="codigo" name="codigo" value="no disponible" disabled>
            </fieldset>

            <fieldset>
                <legend>Código de cliente</legend>

                <label for="codigo">Código de cliente:</label>
                <input type="text" id="codigo" name="Codigo">

            </fieldset>


            <fieldset>
                <legend>Observaciones</legend>

                <textarea id="Mensaje" name="Mensaje" rows="10" cols="40"></textarea>

            </fieldset>




            <button type="submit" class="enviar">Enviar</button>

            <button type="reset" class="borrar">Borrar datos</button>
            <button type="button" popovertarget="informacion">Más información</button>

            <div id="informacion" popover>
                <h1>Nuestro alojamiento</h1>
                <h3>Dirección</h3>
                


                <p>Calle Baritono Aguilar 1</p>
                <button type="button" popovertarget="informacion" popovertargetaction="hide">Cerrar</button>
            </div>

    </form>


</body>

</html>
